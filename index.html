<html lang="en">
<head>
<meta charset="utf-8"/>

<title>Athens — our trip map</title>
<meta name="description" content="Our Athens trip: curated bars, restaurants and cafés near the apartment + the Riviera. Free OpenStreetMap, live location, no account needed."/>

<!-- Leaflet (free map library) + OpenStreetMap tiles — NO API key, NO Google, NO billing. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --ink:#0f2a3f; --muted:#5b7186; --line:#e4ecf2; --card:#fff; --bg:#f3f7fa;
    --sea:#1e88c7; --sea-2:#0e5a8a;
    --restaurant:#2e9e5b; --bar:#8e44ad; --cafe:#c0883a; --home:#e8772e;
    --shadow:0 6px 20px rgba(10,40,70,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
  .app{display:flex;flex-direction:column;height:100dvh}
  header.top{padding:10px 14px;background:linear-gradient(120deg,#0e5a8a,#1e88c7);color:#fff;flex:none}
  header.top h1{margin:0;font-family:'Playfair Display',serif;font-size:21px;font-weight:800;letter-spacing:.2px}
  header.top .sub{font-size:12px;opacity:.92;margin-top:2px}

  .filters{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:8px 10px}
  .row{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  .chip,.toggle{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip[data-cat="restaurant"][aria-pressed="true"]{background:var(--restaurant);border-color:var(--restaurant)}
  .chip[data-cat="bar"][aria-pressed="true"]{background:var(--bar);border-color:var(--bar)}
  .chip[data-cat="cafe"][aria-pressed="true"]{background:var(--cafe);border-color:var(--cafe)}
  .toggle[aria-pressed="true"]{background:#e7f3fb;border-color:var(--sea);color:var(--sea-2)}
  .dot{width:9px;height:9px;border-radius:50%}
  .toggles{margin-top:7px}

  .main{flex:1;display:flex;flex-direction:column;min-height:0}
  #map{height:44dvh;flex:none;z-index:1;background:#dfe7ee}
  .leaflet-control-attribution{font-size:9px}

  .listwrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 12px 80px}
  .count{font-size:12px;color:var(--muted);margin:4px 2px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px;cursor:pointer;position:relative;transition:box-shadow .15s,border-color .15s}
  .card:active{border-color:var(--sea)}
  .card.active{border-color:var(--sea-2);box-shadow:0 0 0 3px rgba(30,136,199,.15)}
  .card h3{margin:0 26px 2px 0;font-size:15.5px;font-weight:700}
  .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pin{width:9px;height:9px;border-radius:50%;display:inline-block}
  .blurb{font-size:12.5px;color:#33485c;margin-top:6px;line-height:1.4}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#eef4f8;color:#37536b}
  .badge.veg{background:#e7f6ec;color:#1f7a44}
  .badge.opt{background:#eaf6ee;color:#2c7a4e}
  .badge.meat{background:#f6ece7;color:#9c5a2e}
  .badge.area{background:#eef2f6;color:#4a5e72}
  .star{position:absolute;top:10px;right:10px;font-size:19px;line-height:1;cursor:pointer;color:#c7d3dd;user-select:none}
  .star.on{color:#f5b301}

  /* bottom-sheet detail */
  .detail{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#fff;border-radius:18px 18px 0 0;
    box-shadow:0 -10px 30px rgba(10,40,70,.22);transform:translateY(110%);transition:transform .25s;max-height:82dvh;overflow-y:auto;padding:14px 16px 24px}
  .detail.open{transform:translateY(0)}
  .detail .grab{width:42px;height:5px;border-radius:3px;background:#d7e0e8;margin:2px auto 10px}
  .detail h2{margin:0 0 4px;font-family:'Playfair Display',serif;font-size:22px}
  .detail .x{position:absolute;top:12px;right:14px;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .btn{flex:1 1 46%;text-align:center;text-decoration:none;border-radius:11px;padding:11px 10px;font-size:13.5px;font-weight:700;border:1px solid var(--line);color:var(--ink);background:#fff;cursor:pointer}
  .btn.primary{background:var(--sea);color:#fff;border-color:var(--sea)}
  .btn.wa{background:#25d366;color:#fff;border-color:#25d366}
  .btn.dim{color:#9fb0bd;background:#f6f9fb}

  .ctrls{position:absolute;right:12px;z-index:600;display:flex;flex-direction:column;gap:8px}
  .mbtn{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mbtn.on{background:var(--sea);color:#fff;border-color:var(--sea)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(40px);opacity:0;background:#0f2a3f;color:#fff;
    padding:10px 16px;border-radius:999px;font-size:13px;z-index:2000;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  .homeicon{font-size:24px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  @media(min-width:900px){ #map{height:52dvh} .detail{left:auto;right:18px;bottom:18px;width:420px;border-radius:18px} }
</style>
</head>

  <div class="main">

</div>

  {cat:'restaurant', name:'Barbounaki', query:'Barbounaki, Glyfada, Athens', area:'Glyfada', tags:['beach','ride'], blurb:'Fresh-fish taverna — red mullet (barbouni) is the signature; lively and well-priced.'},

  {cat:'restaurant', name:'Ithaki', query:'Ithaki, Vouliagmeni, Athens', area:'Vouliagmeni', tags:['beach','ride','view'], blurb:'Chic seafood over Vouliagmeni bay — wagyu and lobster, sunset views. A splurge.'},
  {cat:'restaurant', name:'Taverna 37', query:'Taverna 37, Four Seasons Astir Palace, Vouliagmeni', area:'Vouliagmeni', tags:['beach','ride','view'], blurb:'Upscale seaside Greek taverna at the Four Seasons Astir Palace.'},
  {cat:'bar', name:'Holy Spirit Cocktail Bar', query:'Holy Spirit Cocktail Bar, Glyfada', area:'Glyfada', tags:['beach','ride'], blurb:'Award-winning Glyfada cocktail bar — playful, well-priced drinks and a fun young crowd.'},
  {cat:'bar', name:'Bolivar Beach Bar', query:'Bolivar Beach Bar, Alimos', book:'https://www.i-host.gr/Reservations/New?restaurant=2113&channel=website&lang=eng', area:'Alimos', tags:['beach','ride','view'], wa:'+30 697 036 7684', blurb:'Iconic palm-fringed beach club — DJ sunsets that roll into a dance floor. Closest Riviera beach bar to the centre.'},
  {cat:'bar', name:'Island Club', query:'Island Club Restaurant, Varkiza coast, Athens', area:'Vouliagmeni', tags:['beach','ride','view'], blurb:'30-year seaside club-restaurant — mixologist cocktails and dancing into the night.'},
  {cat:'cafe', name:'Oven Voula', query:'Oven, Voula, Athens', area:'Voula', tags:['beach','ride'], blurb:'Third-wave bakery-café — artisan bread, brunch and smoothie bowls by the coast.'},
  {cat:'cafe', name:'Riviera Coast', query:'Riviera Coast, Voula, Athens', area:'Voula', tags:['beach','ride','view'], blurb:'Huge seafront all-day café-restaurant by Kavouri beach.'},
];

const CAT = { restaurant:{label:'Restaurant',color:'#2e9e5b'}, bar:{label:'Bar',color:'#8e44ad'}, cafe:{label:'Coffee',color:'#c0883a'} };

// Neighbourhood centres — pins drop here instantly, then sharpen to the exact spot via OSM geocoding.
const AREA = {
  'Center':[37.9803,23.7250],'Koumoundourou Sq':[37.98028,23.72139],'Psyrri':[37.9785,23.7256],
  'Monastiraki':[37.9762,23.7258],'Plaka':[37.9722,23.7300],'Kerameikos':[37.9786,23.7150],
  'Gazi':[37.9772,23.7110],'Metaxourgeio':[37.9846,23.7185],'Syntagma':[37.9755,23.7348],
  'Omonia':[37.9842,23.7283],'Makrygianni':[37.9685,23.7290],'Koukaki':[37.9650,23.7250],
  'Exarchia':[37.9866,23.7335],'Petralona':[37.9690,23.7060],'Kolonaki':[37.9790,23.7430],
  'Pl. Vathis':[37.9880,23.7270],'Glyfada':[37.8650,23.7540],'Vouliagmeni':[37.8090,23.7810],
  'Voula':[37.8460,23.7700],'Alimos':[37.9120,23.7050]
};

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cacheGet=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
const cacheSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}

function haversine(a,b){const R=6371000,r=Math.PI/180,
  dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r,
  s=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(s)));}

const state={cat:'all',q:'',filters:{fav:false,vegan:false,veganopt:false,veg:false,sport:false,beach:false,view:false,walk:false}};
let favs=new Set(cacheGet('ath_favs')||[]);
let map, userMarker, accCircle, watchId=null, following=false;
const els=[];   // list DOM nodes by index

/* ---------- start coords: neighbourhood centre + a small stable spread ---------- */
function startCoords(p,idx){
  const c=AREA[p.area]||[BASE.lat,BASE.lng];
  const jLat=(((idx*73)%100)/100-0.5)*0.0015;
  const jLng=(((idx*127)%100)/100-0.5)*0.0019;
  return {lat:c[0]+jLat, lng:c[1]+jLng};
}

function pinColor(p){return CAT[p.cat].color;}

function init(){
  map=L.map('map',{zoomControl:true,attributionControl:true}).setView([BASE.lat,BASE.lng],15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  // 🏠 apartment marker
  L.marker([BASE.lat,BASE.lng],{icon:L.divIcon({className:'',html:'<div class="homeicon">🏠</div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:1000})
    .addTo(map).on('click',()=>toast('🏠 Your apartment — Pl. Eleftherias 22'));

  PLACES.forEach((p,idx)=>{
    const cached=cacheGet('ath_xy_'+p.query);
    p._ll=cached||startCoords(p,idx);
    p._exact=!!cached;
    p._dist=haversine(BASE,p._ll);
    p._marker=L.circleMarker([p._ll.lat,p._ll.lng],{radius:7,weight:2,color:'#fff',fillColor:pinColor(p),fillOpacity:1})
      .on('click',()=>openDetail(idx));
    p._marker.addTo(map);
  });

  buildList();
  wireControls();
  applyFilters();
  geocodeAll();         // sharpen pins in the background (free OSM geocoder, cached)
  setTimeout(()=>map.invalidateSize(),300);
}

/* ---------- list ---------- */
function buildList(){
  const list=$('#list'); list.innerHTML='';
  PLACES.forEach((p,idx)=>{
    const d=document.createElement('div'); d.className='card'; d.dataset.idx=idx;
    d.innerHTML=cardHTML(p,idx);
    d.addEventListener('click',e=>{ if(e.target.classList.contains('star')) return; openDetail(idx); });
    list.appendChild(d); els[idx]=d;
  });
  list.addEventListener('click',e=>{ if(e.target.classList.contains('star')){ e.stopPropagation(); toggleFav(+e.target.dataset.i);} });
}
function dietBadge(p){
  if(p.vegan==='full') return '<span class="badge veg">🌱 100% vegan</span>';
  if(p.vegan==='options') return '<span class="badge opt">🥗 vegan options</span>';
  if(p.vegan==='veg') return '<span class="badge opt">🥦 vegetarian</span>';
  if(p.cat==='restaurant') return '<span class="badge meat">🍖 meat / non-veg</span>';
  return '';
}
function distLabel(p){
  if((p.tags||[]).includes('ride')) return '🏖️ Riviera · tram/taxi';
  const m=p._dist; const mins=Math.max(1,Math.round(m/80));
  const dtxt = m>=1000 ? (m/1000).toFixed(1)+' km' : m+' m';
  return `🚶 ${dtxt} · ~${mins} min${p._exact?'':' ≈'}`;
}
function cardHTML(p,idx){
  const tagbits=[];
  if((p.tags||[]).includes('sport')) tagbits.push('<span class="badge">⚽ football</span>');
  if((p.tags||[]).includes('view')) tagbits.push('<span class="badge">🌅 view</span>');
  return `<span class="star ${favs.has(idx)?'on':''}" data-i="${idx}">${favs.has(idx)?'★':'☆'}</span>
    <h3>${esc(p.name)}</h3>
    <div class="meta"><span class="pin" style="background:${pinColor(p)}"></span>${esc(CAT[p.cat].label)}
      <span class="badge area">${esc(p.area||'')}</span>${p.price?'<span class="badge">'+esc(p.price)+'</span>':''}
      <span>${distLabel(p)}</span></div>
    <div class="badges">${dietBadge(p)}${tagbits.join('')}</div>
    <div class="blurb">${esc(p.blurb||'')}</div>`;
}

/* ---------- filters ---------- */
function visible(idx){
  const p=PLACES[idx], f=state.filters;
  if(state.cat!=='all' && p.cat!==state.cat) return false;
  if(f.fav && !favs.has(idx)) return false;
  if(f.vegan && !(p.vegan==='full')) return false;
  if(f.veganopt && !(p.cat==='restaurant' && (p.vegan==='options'||p.vegan==='full'))) return false;
  if(f.veg && !(p.cat==='restaurant' && (p.vegan==='veg'||p.vegan==='options'||p.vegan==='full'))) return false;
  if(f.sport && !(p.tags||[]).includes('sport')) return false;
  if(f.beach && !(p.tags||[]).includes('beach')) return false;
  if(f.view && !(p.tags||[]).includes('view')) return false;
  if(f.walk){ if((p.tags||[]).includes('ride')) return false; if(p._dist>1700) return false; }
  return true;
}
function applyFilters(){
  let n=0;
  PLACES.forEach((p,idx)=>{
    const v=visible(idx);
    if(els[idx]) els[idx].style.display=v?'':'none';
    if(p._marker){ if(v){ if(!map.hasLayer(p._marker)) p._marker.addTo(map); } else { if(map.hasLayer(p._marker)) map.removeLayer(p._marker); } }
    if(v)n++;
  });
  $('#count').textContent=`${n} place${n!==1?'s':''} shown`;
}

/* ---------- detail (bottom sheet) ---------- */
function openDetail(idx){
  const p=PLACES[idx];
  if(p._marker) map.panTo(p._marker.getLatLng());
  els.forEach(e=>e&&e.classList.remove('active')); if(els[idx]) els[idx].classList.add('active');
  const gmaps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.query);
  const gdir='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.query)+'&travelmode=walking';
  const acts=[`<a class="btn primary" href="${gmaps}" target="_blank" rel="noopener">🗺️ Open in Google Maps</a>`,
    `<a class="btn" href="${gdir}" target="_blank" rel="noopener">🧭 Directions</a>`];
  if(p.wa) acts.push(`<a class="btn wa" href="https://wa.me/${p.wa.replace(/[^0-9]/g,'')}" target="_blank" rel="noopener">💬 WhatsApp</a>`);
  if(p.book) acts.push(`<a class="btn" href="${esc(p.book)}" target="_blank" rel="noopener">📅 Book a table</a>`);
  $('#detail').innerHTML=`<div class="x" onclick="closeDetail()">×</div><div class="grab"></div>
    <h2>${esc(p.name)}</h2>
    <div class="meta"><span class="pin" style="background:${pinColor(p)}"></span>${esc(CAT[p.cat].label)}
      <span class="badge area">${esc(p.area||'')}</span>${p.price?'<span class="badge">'+esc(p.price)+'</span>':''}
      <span>${distLabel(p)}</span></div>
    <div class="badges">${dietBadge(p)}</div>
    <div class="blurb" style="margin-top:10px">${esc(p.blurb||'')}</div>
    <div class="acts">${acts.join('')}</div>
    <div style="font-size:11px;color:#9fb0bd;margin-top:12px">Tap “Open in Google Maps” for live ratings, reviews, photos, hours and navigation.</div>`;
  $('#detail').classList.add('open');
}
function closeDetail(){ $('#detail').classList.remove('open'); els.forEach(e=>e&&e.classList.remove('active')); }

/* ---------- favorites ---------- */
function toggleFav(idx){
  if(favs.has(idx)) favs.delete(idx); else favs.add(idx);
  cacheSet('ath_favs',[...favs]);
  const el=els[idx]; if(el){const s=el.querySelector('.star'); if(s){s.classList.toggle('on');s.textContent=favs.has(idx)?'★':'☆';}}
  if(state.filters.fav) applyFilters();
}

/* ---------- controls ---------- */
function wireControls(){
  $('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b)return;
    state.cat=b.dataset.cat;
    document.querySelectorAll('#chips .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));
    syncToggles(); applyFilters();
  });
  $('#toggles').addEventListener('click',e=>{const b=e.target.closest('.toggle'); if(!b)return;
    const f=b.dataset.f, on=b.getAttribute('aria-pressed')!=='true';
    b.setAttribute('aria-pressed',on); state.filters[f]=on; applyFilters();
  });
  syncToggles();
  $('#locateBtn').addEventListener('click',toggleLocate);
  $('#homeBtn').addEventListener('click',()=>{map.setView([BASE.lat,BASE.lng],15);});
}
function syncToggles(){
  document.querySelectorAll('#toggles .toggle').forEach(b=>{
    const show=b.dataset.show; const ok=!show||show.split(',').includes(state.cat)||state.cat==='all';
    b.style.display=ok?'':'none';
    if(!ok && b.getAttribute('aria-pressed')==='true'){ b.setAttribute('aria-pressed','false'); state.filters[b.dataset.f]=false; }
  });
}

/* ---------- live location (blue dot) ---------- */
function toggleLocate(){
  if(!navigator.geolocation){ toast('Your browser can’t share location.'); return; }
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; following=false;
    $('#locateBtn').classList.remove('on'); if(userMarker){map.removeLayer(userMarker);userMarker=null;} if(accCircle){map.removeLayer(accCircle);accCircle=null;} return; }
  following=true; $('#locateBtn').classList.add('on');
  watchId=navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude], acc=pos.coords.accuracy||40;
    if(!userMarker){
      userMarker=L.circleMarker(ll,{radius:7,weight:3,color:'#fff',fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
      accCircle=L.circle(ll,{radius:acc,weight:1,color:'#1a73e8',fillColor:'#1a73e8',fillOpacity:.12}).addTo(map);
      map.setView(ll,16);
    } else { userMarker.setLatLng(ll); accCircle.setLatLng(ll); accCircle.setRadius(acc); if(following) map.panTo(ll); }
  },err=>{ toast('Couldn’t get your location.'); $('#locateBtn').classList.remove('on'); watchId=null; },
  {enableHighAccuracy:true,maximumAge:5000,timeout:12000});
  map.on('dragstart',()=>{following=false;});
}

/* ---------- background geocoding: sharpen pins via free OSM Nominatim (cached, throttled) ---------- */
async function geocodeAll(){
  for(let idx=0;idx<PLACES.length;idx++){
    const p=PLACES[idx];
    if(p._exact) continue;                       // already have an exact (cached) point
    try{
      const q=p.query.replace(/,?\s*Athens\s*$/i,'')+', Athens, Greece';
      const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q);
      const r=await fetch(url,{headers:{'Accept':'application/json'}});
      if(r.ok){ const j=await r.json();
        if(j&&j[0]){ const ll={lat:+j[0].lat,lng:+j[0].lon};
          cacheSet('ath_xy_'+p.query,ll);
          p._ll=ll; p._exact=true; p._dist=haversine(BASE,ll);
          if(p._marker) p._marker.setLatLng([ll.lat,ll.lng]);
          if(els[idx]) els[idx].innerHTML=cardHTML(p,idx);
        }
      }
    }catch(e){/* offline / blocked → keep the neighbourhood pin */}
    await new Promise(r=>setTimeout(r,1200));    // be polite to the free OSM geocoder (≤1/sec)
  }
  applyFilters();
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });
window.addEventListener('load',init);
</script>
